/* vim: set expandtab tabstop=4: */

/* yeti node without databases. all routing/cdr queries are served by postgresql_proxy
 * paths are relative to the e2e_tests dir */

signaling-interfaces {
    /* no ACLs. used as control channel by test harness */
    interface input {
        default-media-interface = input
        ip4 {
            sip-udp {
                address = 127.0.0.1
                port = 5060
                use-raw-sockets = off
            }
            sip-tcp {
                address = 127.0.0.1
                port = 5060
                connect-timeout = 2000
                static-client-port = on
                idle-timeout=900000
            }
        }
    }

    /* all ACL kinds with 'reject' method on UDP. TCP on the same interface has no ACLs */
    interface acl_reject {
        default-media-interface = input
        ip4 {
            sip-udp {
                address = 127.0.0.1
                port = 5070
                use-raw-sockets = off
                origination-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = reject
                }
                options-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = reject
                }
                register-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = reject
                }
                message-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = reject
                }
            }
            sip-tcp {
                address = 127.0.0.1
                port = 5070
                connect-timeout = 2000
                static-client-port = on
                idle-timeout=900000
            }
        }
    }

    /* all ACL kinds with 'drop' method on UDP and TCP */
    interface acl_drop {
        default-media-interface = input
        ip4 {
            sip-udp {
                address = 127.0.0.1
                port = 5071
                use-raw-sockets = off
                origination-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
                options-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
                register-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
                message-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
            }
            sip-tcp {
                address = 127.0.0.1
                port = 5071
                connect-timeout = 2000
                static-client-port = on
                idle-timeout=900000
                origination-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
                options-acl {
                    whitelist = { 127.0.0.2/32 }
                    method = drop
                }
            }
        }
    }

    /* only options-acl with several networks */
    interface acl_options_only {
        default-media-interface = input
        ip4 {
            sip-udp {
                address = 127.0.0.1
                port = 5072
                use-raw-sockets = off
                options-acl {
                    whitelist = { 127.0.0.2/32, 127.0.1.0/24 }
                    method = reject
                }
            }
        }
    }
}

media-interfaces {
    interface input {
        ip4 {
            rtp {
                address = 127.0.0.1
                low-port = 50000
                high-port = 59999
                dscp = 46
                use-raw-sockets = off
            }
        }
    }
}

modules {
    path = {
        ../build/src/
    }

    module "wav"{}
    module "amr"{}
    module "session_timer"{}

    module-global "uac_auth" {
        server_secret = somesecret
    }

    module "jsonrpc" {
        listen {
            address = 127.0.0.1
            port = 7080
        }
        server_threads = 1
    }

    module "redis" {
        max_batch_size = 5
        batch_timeout = 10
        max_queue_size = 20
    }

    module "registrar" {
        expires_min = 5
        expires_max = 7200
        expires_default = 1200
        keepalive_interval = 30
        bindings_max = 15
        redis {
            write {
                hosts = 127.0.0.1:6379
            }
            read {
                hosts = 127.0.0.1:6379
            }
        }
    }

    module-global "postgresql_proxy" {
        log_pg_events = true

        map_lua("writecdr", "./etc/db_map/writecdr.lua")
        map("write_auth_log", null)

        map_lua("SELECT * FROM load_callprofiles()", "./etc/db_map/load_callprofiles.lua")

        map_file("SELECT * FROM check_states()", "./etc/db_map/check_states.json")
        map_file("SELECT * FROM switch22.load_interface_out()", "./etc/db_map/load_interface_out.json")
        map_file("SELECT * FROM load_trusted_lb()", "./etc/db_map/load_trusted_lb.json")
        map_file("SELECT * FROM load_incoming_auth()", "./etc/db_map/load_incoming_auth.json")
        map_file("SELECT * FROM load_resource_types()", "./etc/db_map/load_resource_types.json")
        map_file("SELECT * FROM load_codec_groups()", "./etc/db_map/load_codec_groups.json")
        map_file("SELECT * FROM load_disconnect_code_refuse()", "./etc/db_map/load_disconnect_code_refuse.json")
        map_file("SELECT * FROM load_disconnect_code_rerouting()", "./etc/db_map/load_disconnect_code_rerouting.json")
        map_file("SELECT * FROM load_disconnect_code_rewrite()", "./etc/db_map/load_disconnect_code_rewrite.json")
        map_file("SELECT * FROM load_aleg_gateway_attributes_cache()", "./etc/db_map/load_gateway_attributes_cache.json")
        map_file("SELECT * FROM load_bleg_gateway_attributes_cache()", "./etc/db_map/load_gateway_attributes_cache.json")

        map("SELECT * FROM load_ip_auth2(\$1,\$2)", [])
        map("SELECT * FROM load_radius_accounting_profiles()", [])
        map("SELECT * FROM load_radius_profiles()", [])
        map("SELECT * FROM load_sensor()", [])
        map("SELECT * FROM load_stir_shaken_signing_certificates()", [])
        map("SELECT * FROM load_stir_shaken_trusted_certificates()", [])
        map("SELECT * FROM load_stir_shaken_trusted_repositories()", [])
        map("SELECT * FROM load_disconnect_code_refuse_overrides()", [])
        map("SELECT * FROM load_disconnect_code_rerouting_overrides()", [])
        map("SELECT * FROM load_disconnect_code_rewrite_overrides()", [])
        map("SELECT init(\$1,\$2);", [])
        map("SELECT * FROM load_sip_options_probers(\$1)", [])
        map("SELECT * FROM load_registrations_out(\$1,\$2)", [])
    }

    module "prometheus_exporter" {
        address = 127.0.0.1
        port = 8090
    }

    module "radius_client" {}

    module-global "yeti" {
        audio_recorder_dir = ./spool/record
        msg_logger_dir = ./spool/dump

        routing {
            lega_gw_cache_key = "lega_gw_cache_id"
            legb_gw_cache_key = "legb_gw_cache_id"
        }

        resources {
            scripts_dir = ../etc
        }

        /* write every CDR immediately (see etc/db_map/writecdr.lua) */
        cdr {
            batch_size = 1
            batch_timeout = 1000
        }
    }
}

routing {
    application=yeti
    register_application=yeti
}

general {
    signature="yeti-e2e"

    stderr=yes
    syslog_loglevel=3

    node_id = 8

    media_processor_threads = 1
    session_processor_threads = 1
    sip_udp_server_threads = 1
    sip_tcp_server_threads = 1

    dead_rtp_time=0

    enable_rtsp=no

    log_dump_path = ./spool/logdump
    rsr_path = ./spool/rsr
}
